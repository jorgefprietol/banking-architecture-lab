name: Publish verified images
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tested-images
          path: artifacts/images
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Load, verify and promote the tested images without rebuilding
        id: promote
        run: python3 scripts/image_bundle.py promote
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/ledger-csharp
          subject-digest: ${{ steps.promote.outputs.ledger_csharp_digest }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/audit-csharp
          subject-digest: ${{ steps.promote.outputs.audit_csharp_digest }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/java
          subject-digest: ${{ steps.promote.outputs.java_digest }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/ledger-csharp
          subject-digest: ${{ steps.promote.outputs.ledger_csharp_digest }}
          sbom-path: artifacts/images/ledger-csharp.cdx.json
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/audit-csharp
          subject-digest: ${{ steps.promote.outputs.audit_csharp_digest }}
          sbom-path: artifacts/images/audit-csharp.cdx.json
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/java
          subject-digest: ${{ steps.promote.outputs.java_digest }}
          sbom-path: artifacts/images/java.cdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: promotion-evidence
          path: |
            artifacts/images/manifest.json
            artifacts/images/promotion.json
            artifacts/images/*.cdx.json
